<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0a1e">
<title>Sonara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#050510;}

/* ── LAYOUT ── */
body{display:flex;justify-content:center;align-items:stretch;}
#root{
  width:100%;max-width:430px;height:100vh;
  font-family:'DM Sans',sans-serif;
  color:#e6e0f8;position:relative;overflow:hidden;
}

/* ── STARS ── */
.sky{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;transition:opacity 2s;}
.star{
  position:absolute;border-radius:50%;background:#fff;
  animation:shine var(--d,3s) infinite alternate ease-in-out;
}
@keyframes shine{0%{opacity:.08}100%{opacity:var(--op,.7)}}

/* ── SCROLLABLE CONTENT ── */
.page{
  position:relative;z-index:2;
  height:100%;display:flex;flex-direction:column;
}
.scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:88px;
  scrollbar-width:none;
}
.scroll::-webkit-scrollbar{display:none;}

/* ── HEADER ── */
.hdr{padding:52px 20px 12px;}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;}
.app-name{font-family:'DM Serif Display',serif;font-size:32px;color:#ede8ff;letter-spacing:-.5px;}
.app-tagline{font-size:11px;color:rgba(255,255,255,.22);margin-top:3px;letter-spacing:.5px;}
.app-date{font-size:11px;color:rgba(255,255,255,.15);margin-top:2px;letter-spacing:1px;}
.lang-toggle{
  margin-top:50px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  color:rgba(255,255,255,.5);font-size:11px;padding:6px 12px;
  border-radius:20px;cursor:pointer;font-family:'DM Sans',sans-serif;
  flex-shrink:0;
}

/* ── BADGES ── */
.badges{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;padding:4px 11px;border-radius:20px;
}
.badge-plan{background:rgba(167,139,250,.14);border:1px solid rgba(167,139,250,.35);color:#a78bfa;}
.badge-streak{background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.28);color:#fb923c;}

/* ── CALM QUOTE ── */
.quote-bar{
  margin:0 16px 14px;padding:13px 15px;
  background:rgba(255,255,255,.05);border-radius:14px;
  border-left:3px solid #a78bfa;
}
.quote-bar p{color:#c4b5fd;font-size:13px;font-style:italic;line-height:1.65;}

/* ── PROGRESS ── */
.prog-wrap{padding:0 16px 14px;}
.prog-labels{display:flex;justify-content:space-between;margin-bottom:5px;}
.prog-labels span{font-size:10px;color:rgba(255,255,255,.22);letter-spacing:1.5px;}
.prog-track{height:3px;background:rgba(255,255,255,.07);border-radius:3px;}
.prog-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,#a78bfa,#f0abfc);
  transition:width .5s ease;
}

/* ── CATEGORY TABS ── */
.cat-row{display:flex;gap:6px;padding:0 16px 14px;}
.cat-btn{
  flex:1;padding:11px 4px 9px;border-radius:13px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.03);
  color:rgba(255,255,255,.28);font-size:10px;
  text-align:center;cursor:pointer;
  transition:all .2s;font-family:'DM Sans',sans-serif;
}
.cat-btn.on{border-color:var(--cc,#a78bfa);color:var(--cc);background:rgba(167,139,250,.1);}
.cat-icon{display:flex;justify-content:center;margin-bottom:4px;}

/* ── SECTION WRAPPER ── */
.section{padding:0 16px;}

/* ── TASK CARD ── */
.task-card{
  border-radius:14px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07);
  margin-bottom:8px;overflow:hidden;
}
.task-row{display:flex;align-items:center;gap:10px;padding:13px 14px;position:relative;}
.task-card.done .task-row{opacity:.32;}
.chk{
  width:24px;height:24px;border-radius:50%;
  border:1.5px solid rgba(167,139,250,.35);background:transparent;
  cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.chk.on{background:#a78bfa;border-color:#a78bfa;}
.task-body{flex:1;min-width:0;}
.task-txt{font-size:14px;color:#d8d0f0;line-height:1.4;}
.task-card.done .task-txt{text-decoration:line-through;color:#3d3260;}
.task-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;}
.type-pill{
  font-size:9px;padding:2px 7px;border-radius:8px;
  font-weight:500;letter-spacing:.5px;
}
.pill-daily{background:rgba(52,211,153,.11);color:#34d399;border:1px solid rgba(52,211,153,.2);}
.pill-once{background:rgba(167,139,250,.11);color:#a78bfa;border:1px solid rgba(167,139,250,.2);}
.timer-pill{
  font-size:10px;padding:3px 9px;border-radius:18px;
  background:rgba(167,139,250,.1);color:#a78bfa;
  cursor:pointer;white-space:nowrap;
  border:1px solid rgba(167,139,250,.18);
  font-family:'DM Sans',sans-serif;
}
.timer-pill.live{color:#f0abfc;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.del-btn{
  background:transparent;border:none;
  color:rgba(255,255,255,.1);cursor:pointer;
  font-size:18px;padding:4px;line-height:1;flex-shrink:0;
}
.expand-btn{
  background:transparent;border:none;
  color:rgba(255,255,255,.18);cursor:pointer;
  font-size:11px;padding:0 4px;flex-shrink:0;
  transition:transform .2s;
}
.expand-btn.open{transform:rotate(90deg);}

/* ── SUBTASKS ── */
.subtask-list{padding:0 14px 12px 48px;}
.sub-row{
  display:flex;align-items:center;gap:8px;
  padding:6px 0;border-top:1px solid rgba(255,255,255,.04);
}
.sub-chk{
  width:18px;height:18px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.18);background:transparent;
  cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.sub-chk.on{background:rgba(167,139,250,.45);border-color:#a78bfa;}
.sub-txt{flex:1;font-size:12px;color:rgba(255,255,255,.45);}
.sub-txt.done{text-decoration:line-through;color:rgba(255,255,255,.18);}
.sub-del{background:transparent;border:none;color:rgba(255,255,255,.1);cursor:pointer;font-size:14px;padding:2px;}
.sub-add{
  display:flex;align-items:center;gap:6px;
  padding:6px 0;border-top:1px solid rgba(255,255,255,.04);
}
.sub-input{
  flex:1;background:transparent;border:none;
  color:rgba(255,255,255,.45);font-size:12px;
  outline:none;font-family:'DM Sans',sans-serif;
}
.sub-input::placeholder{color:rgba(255,255,255,.14);}
.sub-add-btn{
  background:rgba(167,139,250,.18);border:none;color:#a78bfa;
  border-radius:6px;width:22px;height:22px;
  cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

/* ── ADD TASK ── */
.add-task-wrap{
  background:rgba(255,255,255,.035);border:1px dashed rgba(255,255,255,.09);
  border-radius:14px;padding:14px;margin-bottom:8px;
}
.add-row{display:flex;gap:8px;align-items:center;}
.add-input{
  flex:1;padding:10px 12px;border-radius:10px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.055);
  color:#e6e0f8;font-size:13px;outline:none;
  font-family:'DM Sans',sans-serif;
}
.add-input::placeholder{color:rgba(255,255,255,.16);}
.add-go{
  width:40px;height:40px;border-radius:10px;
  background:#a78bfa;border:none;color:#1a073d;
  font-size:22px;font-weight:bold;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.type-row{display:flex;gap:6px;margin-top:8px;}
.type-opt{
  flex:1;padding:7px;border-radius:8px;
  border:1px solid rgba(255,255,255,.07);background:transparent;
  color:rgba(255,255,255,.28);font-size:11px;
  cursor:pointer;font-family:'DM Sans',sans-serif;
  text-align:center;transition:all .2s;
}
.type-opt.on{border-color:#a78bfa;color:#a78bfa;background:rgba(167,139,250,.11);}

/* ── TIMER PICKER ── */
.timer-picker{
  position:absolute;right:8px;top:52px;
  background:#110828;border:1px solid rgba(167,139,250,.28);
  border-radius:14px;padding:8px;z-index:30;
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;
  min-width:198px;box-shadow:0 14px 44px rgba(0,0,0,.65);
}
.t-opt{
  padding:9px 6px;border-radius:9px;font-size:12px;
  background:rgba(255,255,255,.04);color:#c4b5fd;border:none;
  cursor:pointer;font-family:'DM Sans',sans-serif;text-align:center;
}
.cat-limit{font-size:11px;color:rgba(255,255,255,.18);text-align:center;padding:10px 0;}

/* ── SOUND SECTION ── */
.snd-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.snd-btn{
  padding:16px 8px;border-radius:14px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.03);
  color:rgba(255,255,255,.32);font-size:12px;
  cursor:pointer;text-align:center;
  font-family:'DM Sans',sans-serif;transition:all .2s;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.snd-btn.on{border-color:#a78bfa;color:#a78bfa;background:rgba(167,139,250,.12);}
.snd-icon{font-size:26px;}
.vol-row{display:flex;align-items:center;gap:10px;margin-top:14px;}
.vol-row label{font-size:11px;color:rgba(255,255,255,.25);}
.vol-row input[type=range]{flex:1;accent-color:#a78bfa;}

/* ── SCHEDULE SECTION ── */
.sched-card{
  background:rgba(255,255,255,.05);border-radius:16px;
  padding:18px;margin-bottom:12px;
  border:1px solid rgba(255,255,255,.07);
}
.sched-heading{
  font-size:10px;color:rgba(167,139,250,.65);
  margin-bottom:16px;font-weight:500;
  letter-spacing:2px;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;
}
.sched-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sched-lbl{font-size:13px;color:rgba(255,255,255,.42);}
.sched-lbl small{display:block;font-size:10px;color:rgba(255,255,255,.17);margin-top:2px;}
.time-input{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  color:#ede8ff;padding:8px 12px;border-radius:10px;
  font-size:15px;font-family:'DM Sans',sans-serif;outline:none;
}
.sel-input{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  color:#ede8ff;padding:8px 12px;border-radius:10px;
  font-size:13px;font-family:'DM Sans',sans-serif;outline:none;
}
.sel-input option{background:#110828;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.toggle-lbl{font-size:12px;color:rgba(255,255,255,.32);}
.tog{
  width:44px;height:24px;border-radius:12px;
  background:rgba(255,255,255,.1);border:none;
  cursor:pointer;position:relative;transition:background .3s;flex-shrink:0;
}
.tog.on{background:#a78bfa;}
.tog::after{
  content:'';position:absolute;
  width:18px;height:18px;background:white;border-radius:50%;
  top:3px;left:3px;transition:left .3s;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}
.tog.on::after{left:23px;}
.cycles-info{
  font-size:11px;color:#a78bfa;text-align:center;
  padding:10px 12px;background:rgba(167,139,250,.07);
  border-radius:10px;line-height:1.55;margin:4px 0 8px;
}
.divider{height:1px;background:rgba(255,255,255,.05);margin:8px 0 12px;}
.action-btn{
  width:100%;padding:14px;border-radius:12px;
  font-size:13px;cursor:pointer;
  font-family:'DM Sans',sans-serif;
  margin-top:8px;display:flex;align-items:center;
  justify-content:center;gap:8px;border:none;
}

/* ── BREATHE SECTION ── */
.breath-card{
  background:rgba(255,255,255,.05);border-radius:16px;
  padding:18px;margin-bottom:10px;
  border:1px solid rgba(255,255,255,.07);
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:16px;
}
.breath-card:hover{background:rgba(255,255,255,.08);}
.breath-icon-wrap{
  width:52px;height:52px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.breath-name{font-size:15px;color:#e6e0f8;font-weight:500;margin-bottom:3px;}
.breath-desc{font-size:12px;color:rgba(255,255,255,.28);line-height:1.45;}
.breath-tag{
  font-size:10px;padding:3px 8px;border-radius:8px;
  font-weight:500;margin-top:6px;display:inline-block;
}

/* ── SUMMARY SECTION ── */
.sum-card{
  background:rgba(255,255,255,.05);border-radius:14px;
  padding:14px;margin-bottom:10px;
  border:1px solid rgba(255,255,255,.07);
}
.sum-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.sum-cat-name{font-size:13px;color:#c4b5fd;flex:1;}
.sum-count{font-size:11px;color:rgba(255,255,255,.18);}
.sum-bar{height:2px;background:rgba(255,255,255,.07);border-radius:2px;margin-bottom:8px;}
.sum-fill{height:100%;border-radius:2px;transition:width .4s;}
.sum-task{
  font-size:12px;color:rgba(255,255,255,.32);
  padding:3px 0;display:flex;align-items:center;gap:6px;
}
.sum-task.done{color:rgba(255,255,255,.14);}

/* ── BOTTOM NAV ── */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;
  display:flex;justify-content:space-around;
  padding:11px 8px 26px;
  background:rgba(5,4,18,.92);backdrop-filter:blur(26px);
  border-top:1px solid rgba(255,255,255,.06);z-index:40;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  background:transparent;border:none;
  color:rgba(255,255,255,.22);font-size:10px;
  cursor:pointer;font-family:'DM Sans',sans-serif;
  padding:4px 14px;border-radius:12px;
  transition:all .2s;letter-spacing:.5px;
}
.nav-btn.on{color:#a78bfa;}
.nav-btn.on svg{filter:drop-shadow(0 0 6px rgba(167,139,250,.6));}

/* ── OVERLAYS ── */
.overlay{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:22px;padding:24px;
  max-width:430px;margin:0 auto;
}
.overlay.hidden{display:none;}

/* Breath overlay */
.ring-wrap{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center;}
.ring{
  position:absolute;border-radius:50%;
  transition:transform 1.2s ease-in-out,border-color 1.2s;
}
.ring-outer{inset:0;border:2px solid rgba(167,139,250,.13);position:absolute;}
.ring-inner{inset:16px;border:2px solid rgba(167,139,250,.22);position:absolute;}
.breath-circle{
  width:140px;height:140px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;z-index:2;transition:all 1.2s;
  border:2px solid transparent;
}
.breath-num{font-size:54px;font-family:'DM Serif Display',serif;line-height:1;}
.breath-lbl{font-size:11px;letter-spacing:3px;margin-top:6px;text-transform:uppercase;}
.overlay-btn{
  padding:12px 32px;border-radius:24px;
  background:transparent;border:1px solid rgba(255,255,255,.13);
  color:rgba(255,255,255,.38);cursor:pointer;
  font-size:12px;font-family:'DM Sans',sans-serif;
}

/* Alert overlay */
#overlay-alert{background:rgba(70,10,10,.98);}
/* Sleep overlay */
#overlay-sleep{background:rgba(10,3,3,.99);}
/* Wake overlay */
#overlay-wake{background:linear-gradient(160deg,#180800,#3a1200,#631e00);}

/* ── NOTIFICATION BANNER ── */
.notif{
  position:fixed;top:0;left:50%;
  transform:translateX(-50%) translateY(-100%);
  width:100%;max-width:430px;z-index:60;
  padding:15px 18px;
  display:flex;align-items:center;gap:12px;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  background:rgba(10,5,26,.96);backdrop-filter:blur(22px);
  border-bottom:1px solid rgba(167,139,250,.18);
}
.notif.show{transform:translateX(-50%) translateY(0);}
.notif-body{flex:1;}
.notif-title{font-size:13px;color:#ede8ff;font-weight:500;}
.notif-sub{font-size:11px;color:rgba(255,255,255,.32);margin-top:2px;}
.notif-action{
  font-size:12px;color:#a78bfa;cursor:pointer;
  padding:6px 11px;border-radius:8px;
  background:rgba(167,139,250,.1);
}

/* ── AUTH SCREEN ── */
#auth{
  position:fixed;inset:0;z-index:80;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:15px;padding:32px;
  background:linear-gradient(160deg,#090e2c,#121946,#23114d);
  max-width:430px;margin:0 auto;
}
#auth.hidden{display:none;}
.auth-logo{font-family:'DM Serif Display',serif;font-size:38px;color:#ede8ff;}
.auth-sub{font-size:11px;color:rgba(255,255,255,.22);margin-top:-8px;}
.lang-row{display:flex;gap:8px;width:100%;margin-bottom:4px;}
.lang-opt{
  flex:1;padding:8px;border-radius:10px;
  border:1px solid rgba(255,255,255,.1);background:transparent;
  color:rgba(255,255,255,.3);font-size:12px;
  cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:all .2s;
}
.lang-opt.on{border-color:rgba(167,139,250,.45);background:rgba(167,139,250,.14);color:#a78bfa;}
.auth-desc{font-size:13px;color:rgba(255,255,255,.32);text-align:center;line-height:1.7;}
.auth-form{width:100%;display:flex;flex-direction:column;gap:10px;}
.auth-input{
  padding:14px;border-radius:14px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.07);
  color:#e6e0f8;font-size:14px;outline:none;
  font-family:'DM Sans',sans-serif;
}
.auth-input::placeholder{color:rgba(255,255,255,.16);}
.auth-btn{
  padding:15px;border-radius:14px;
  background:#a78bfa;border:none;
  color:#18063a;font-size:14px;font-weight:500;
  cursor:pointer;font-family:'DM Sans',sans-serif;
}
.auth-switch{font-size:12px;color:rgba(255,255,255,.2);text-align:center;cursor:pointer;}
.auth-switch span{color:#a78bfa;}

/* ── STRETCH BOX ── */
.stretch-box{
  background:rgba(255,255,255,.07);border-radius:16px;
  padding:20px 24px;width:100%;max-width:300px;text-align:center;
}

/* ── SECTION TITLE ── */
.sec-title{font-size:10px;color:rgba(255,255,255,.2);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;}
</style>
</head>
<body>
<div id="root">

<!-- STARS -->
<div class="sky" id="sky"></div>

<!-- NOTIFICATION BANNER -->
<div class="notif" id="notif">
  <div id="notif-icon"></div>
  <div class="notif-body">
    <div class="notif-title" id="notif-title"></div>
    <div class="notif-sub" id="notif-sub"></div>
  </div>
  <span class="notif-action" id="notif-action"></span>
</div>

<!-- AUTH SCREEN -->
<div id="auth">
  <div class="auth-logo">Sonara</div>
  <div class="auth-sub" id="a-tagline"></div>
  <div class="lang-row">
    <button class="lang-opt on" id="lang-es" onclick="setLang('es')">🇪🇸 Español</button>
    <button class="lang-opt" id="lang-en" onclick="setLang('en')">🇬🇧 English</button>
  </div>
  <!-- Register view -->
  <div id="view-reg" style="width:100%">
    <p class="auth-desc" id="a-desc"></p>
    <div class="auth-form">
      <input class="auth-input" id="r-name" type="text" autocomplete="name">

async function doRegister(){
  const name  = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const pass  = document.getElementById('r-pass').value;
  if(!name||!email||pass.length<6) return;
  const {data,error} = await sb.auth.signUp({email,password:pass,options:{data:{display_name:name}}});
  if(error){ alert(error.message); return; }
  enterApp(data.user);
}
async function doLogin(){
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  if(!email||!pass) return;
  const {data,error} = await sb.auth.signInWithPassword({email,password:pass});
  if(error){ alert(error.message); return; }
  enterApp(data.user);
}
function enterApp(user){
  currentUser = user;
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('main').style.display='flex';
  loadUserData();
  renderAll();
  checkSchedule();
}

/* ════════════════════════════════════════════
   SUPABASE DATA SYNC
   ════════════════════════════════════════════ */
async function loadUserData(){
  if(!currentUser) return;
  const {data} = await sb.from('fd_tasks').select('*').eq('user_id',currentUser.id);
  if(data && data.length){
    tasks = data.map(r=>({
      id:r.id,text:r.text,cat:r.cat,type:r.type,
      done:r.done,subtasks:r.subtasks||[],
      timerMin:r.timer_min,created:r.created_at
    }));
    localStorage.setItem('fd_tasks', JSON.stringify(tasks));
    renderTaskList();
    updateProgress();
  }
  const {data:sc} = await sb.from('fd_schedule').select('*').eq('user_id',currentUser.id).single();
  if(sc){ sched = sc.config; localStorage.setItem('fd_sched',JSON.stringify(sched)); }
  const {data:st} = await sb.from('fd_stats').select('streak').eq('user_id',currentUser.id).single();
  if(st){ streak = st.streak||0; }
}
async function syncTask(task){
  if(!currentUser) return;
  await sb.from('fd_tasks').upsert({
    id:task.id,user_id:currentUser.id,
    text:task.text,cat:task.cat,type:task.type,
    done:task.done,subtasks:task.subtasks,timer_min:task.timerMin
  });
}
async function deleteTaskRemote(id){
  if(!currentUser) return;
  await sb.from('fd_tasks').delete().eq('id',id);
}
async function syncSchedule(){
  if(!currentUser) return;
  await sb.from('fd_schedule').upsert({user_id:currentUser.id,config:sched});
}

/* ════════════════════════════════════════════
   TASKS
   ════════════════════════════════════════════ */
function saveTasks(){ localStorage.setItem('fd_tasks',JSON.stringify(tasks)); }
function catTasks(cat){ return tasks.filter(tk=>tk.cat===cat); }

function addTask(){
  const inp = document.getElementById('new-task-input');
  if(!inp) return;
  const txt = inp.value.trim();
  if(!txt) return;
  if(catTasks(activeCat).length>=5){ showNotif(t().limit,'',''); return; }
  const task = {
    id: Date.now().toString(),
    text:txt,cat:activeCat,type:newTaskType,
    done:false,subtasks:[],timerMin:null,
    created: new Date().toISOString()
  };
  tasks.push(task);
  saveTasks();
  syncTask(task);
  inp.value='';
  renderTaskList();
  updateProgress();
}

function toggleTask(id){
  const tk = tasks.find(t=>t.id===id);
  if(!tk) return;
  tk.done = !tk.done;
  saveTasks();
  syncTask(tk);
  renderTaskList();
  updateProgress();
}

function deleteTask(id){
  tasks = tasks.filter(t=>t.id!==id);
  saveTasks();
  deleteTaskRemote(id);
  if(taskTimers[id]){ clearInterval(taskTimers[id].interval); delete taskTimers[id]; }
  renderTaskList();
  updateProgress();
}

function addSubtask(taskId, val){
  const tk = tasks.find(t=>t.id===taskId);
  if(!tk||!val.trim()) return;
  tk.subtasks.push({id:Date.now().toString(),text:val.trim(),done:false});
  saveTasks();
  syncTask(tk);
  renderTaskList();
}

function toggleSubtask(taskId, subId){
  const tk = tasks.find(t=>t.id===taskId);
  if(!tk) return;
  const sub = tk.subtasks.find(s=>s.id===subId);
  if(sub){ sub.done=!sub.done; saveTasks(); syncTask(tk); renderTaskList(); }
}

function deleteSubtask(taskId, subId){
  const tk = tasks.find(t=>t.id===taskId);
  if(!tk) return;
  tk.subtasks = tk.subtasks.filter(s=>s.id!==subId);
  saveTasks();
  syncTask(tk);
  renderTaskList();
}

/* Timer logic */
const TIMER_MINS = [5,10,15,20,25,30,45,60,90];
function setTimer(taskId, minutes){
  if(taskTimers[taskId]){ clearInterval(taskTimers[taskId].interval); }
  const secs = minutes * 60;
  taskTimers[taskId] = { remaining: secs, interval: null };
  taskTimers[taskId].interval = setInterval(()=>{
    taskTimers[taskId].remaining--;
    if(taskTimers[taskId].remaining <= 0){
      clearInterval(taskTimers[taskId].interval);
      delete taskTimers[taskId];
      showAlertOverlay();
    }
    updateTimerDisplay(taskId);
  }, 1000);
  openTimerPicker = null;
  renderTaskList();
}

function toggleTimerPicker(taskId){
  openTimerPicker = openTimerPicker===taskId ? null : taskId;
  renderTaskList();
}

function fmtTime(secs){
  const m = Math.floor(secs/60), s = secs%60;
  return `${m}:${s<10?'0':''}${s}`;
}

function updateTimerDisplay(taskId){
  const el = document.querySelector(`[data-timer="${taskId}"]`);
  if(el && taskTimers[taskId]){ el.textContent = fmtTime(taskTimers[taskId].remaining); }
}

/* ════════════════════════════════════════════
   SOUNDS (Web Audio API — generados, sin archivos)
   ════════════════════════════════════════════ */
let audioCtx = null;
let soundNodes = {}; // id -> { source, gain, ... }
let masterGain = null;
let currentVolume = 0.5;

function getAudioCtx(){
  if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); masterGain = audioCtx.createGain(); masterGain.gain.value = currentVolume; masterGain.connect(audioCtx.destination); }
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}

function createWhiteNoise(ctx){
  const bufSize = ctx.sampleRate * 2;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = Math.random()*2-1;
  const src = ctx.createBufferSource();
  src.buffer = buf; src.loop = true;
  return src;
}

function createBrownNoise(ctx){
  const bufSize = ctx.sampleRate * 2;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  let last=0;
  for(let i=0;i<bufSize;i++){
    const w = Math.random()*2-1;
    data[i] = (last + .02*w)/1.02;
    last = data[i];
    data[i] *= 3.5;
  }
  const src = ctx.createBufferSource();
  src.buffer=buf; src.loop=true;
  return src;
}

function playSound(id){
  const ctx = getAudioCtx();
  if(soundNodes[id]){ stopSound(id); return; }

  let nodes = {};
  if(id==='rain'){
    const src = createWhiteNoise(ctx);
    const lpf = ctx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=1200; lpf.Q.value=0.5;
    const gain = ctx.createGain(); gain.gain.value = 0.35;
    src.connect(lpf); lpf.connect(gain); gain.connect(masterGain);
    src.start(); nodes={src,gain};
  } else if(id==='waves'){
    const src = createBrownNoise(ctx);
    const lpf = ctx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=500;
    const gain = ctx.createGain(); gain.gain.value=0.5;
    // LFO for wave rhythm
    const lfo = ctx.createOscillator(); lfo.frequency.value=0.12;
    const lfoGain = ctx.createGain(); lfoGain.gain.value=0.3;
    lfo.connect(lfoGain); lfoGain.connect(gain.gain);
    src.connect(lpf); lpf.connect(gain); gain.connect(masterGain);
    src.start(); lfo.start(); nodes={src,gain,lfo};
  } else if(id==='fire'){
    const src = createBrownNoise(ctx);
    const hpf = ctx.createBiquadFilter(); hpf.type='highpass'; hpf.frequency.value=200;
    const lpf = ctx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=1800;
    const gain = ctx.createGain(); gain.gain.value=0.28;
    // Crackle LFO
    const lfo = ctx.createOscillator(); lfo.frequency.value=1.8;
    const lfoGain = ctx.createGain(); lfoGain.gain.value=0.15;
    lfo.connect(lfoGain); lfoGain.connect(gain.gain);
    src.connect(hpf); hpf.connect(lpf); lpf.connect(gain); gain.connect(masterGain);
    src.start(); lfo.start(); nodes={src,gain,lfo};
  } else if(id==='wind'){
    const src = createWhiteNoise(ctx);
    const bpf = ctx.createBiquadFilter(); bpf.type='bandpass'; bpf.frequency.value=400; bpf.Q.value=0.3;
    const gain = ctx.createGain(); gain.gain.value=0.22;
    // Slow LFO for wind gusts
    const lfo = ctx.createOscillator(); lfo.frequency.value=0.08;
    const lfoGain = ctx.createGain(); lfoGain.gain.value=0.2;
    lfo.connect(lfoGain); lfoGain.connect(gain.gain);
    src.connect(bpf); bpf.connect(gain); gain.connect(masterGain);
    src.start(); lfo.start(); nodes={src,gain,lfo};
  }

  soundNodes[id] = nodes;
  renderSoundsState();
}

function stopSound(id){
  if(!soundNodes[id]) return;
  const n = soundNodes[id];
  try{ n.src.stop(); }catch(e){}
  try{ if(n.lfo) n.lfo.stop(); }catch(e){}
  delete soundNodes[id];
  renderSoundsState();
}

function setVolume(v){
  currentVolume = parseFloat(v);
  if(masterGain) masterGain.gain.value = currentVolume;
}

  const tx=t();

/* ════════════════════════════════════════════
   BREATHE
   ════════════════════════════════════════════ */
// ── BREATH SOUNDS ──
let breathAudioCtx = null;
let breathSoundNodes = [];

function stopBreathSound(){
  breathSoundNodes.forEach(n=>{ try{ n.stop(); }catch(e){} });
  breathSoundNodes = [];
}

function playBreathSound(phase, duration){
  stopBreathSound();
  if(phase === 'hold') return; // silencio en retención
  try {
    if(!breathAudioCtx) breathAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = breathAudioCtx;
    const now = ctx.currentTime;
    const bufSize = Math.floor(ctx.sampleRate * duration);
    const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

    const source = ctx.createBufferSource();
    source.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 0.7;
    // inhala: tono más agudo (como aspirar), exhala: más grave (como soltar)
    if(phase === 'inhale'){
      filter.frequency.setValueAtTime(300, now);
      filter.frequency.linearRampToValueAtTime(900, now + duration);
    } else {
      filter.frequency.setValueAtTime(900, now);
      filter.frequency.linearRampToValueAtTime(250, now + duration);
    }

    const gain = ctx.createGain();
    if(phase === 'inhale'){
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.13, now + duration * 0.5);
      gain.gain.linearRampToValueAtTime(0.07, now + duration);
    } else {
      gain.gain.setValueAtTime(0.13, now);
      gain.gain.linearRampToValueAtTime(0.05, now + duration * 0.7);
      gain.gain.linearRampToValueAtTime(0, now + duration);
    }

    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    source.start(now);
    breathSoundNodes.push(source);
  } catch(e){}
}

let breathInterval = null;
let breathMode = 'normal';
let breathCycle = 0;
let breathPhase = 0;
let breathCount = 0;
const BREATH_PATTERNS = {
  normal: [{ph:'inhale',dur:4},{ph:'hold',dur:7},{ph:'exhale',dur:8}],
  sleep:  [{ph:'inhale',dur:4},{ph:'hold',dur:7},{ph:'exhale',dur:8}],
  focus:  [{ph:'inhale',dur:4},{ph:'hold',dur:4},{ph:'exhale',dur:4}],
  wake:   [{ph:'inhale',dur:6},{ph:'exhale',dur:2}],
};
const BREATH_COLORS = {
  inhale:{bg:'rgba(80,40,180,.35)',border:'#a78bfa',text:'#d4b8ff'},
  hold:  {bg:'rgba(40,80,180,.35)',border:'#818cf8',text:'#b8c8ff'},
  exhale:{bg:'rgba(20,20,80,.35)', border:'#6d5acd',text:'#9f8ff0'},
};
const TOTAL_CYCLES = 5;

function renderBreathe(){
  const tx=t();
  document.getElementById('breath-list').innerHTML = tx.breathModes.map(m=>`
    <div class="breath-card" onclick="startBreath('${m.id}',false)"
      style="background:${m.bg}">
      <div class="breath-icon-wrap" style="background:${m.bg}">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="${m.tagColor}" stroke-width="1.4">
          <circle cx="12" cy="12" r="9" stroke-dasharray="3 2"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
      </div>
      <div>
        <div class="breath-name">${m.name}</div>
        <div class="breath-desc">${m.desc}</div>
        <span class="breath-tag" style="background:${m.tagColor}22;color:${m.tagColor}">${m.tag}</span>
      </div>
    </div>
  `).join('');
}

function startBreath(mode, fromAlert){
  if(fromAlert) document.getElementById('overlay-alert').classList.add('hidden');
  breathMode=mode; breathCycle=0; breathPhase=0; breathCount=0;
  document.getElementById('overlay-breath').classList.remove('hidden');
  document.getElementById('b-msg').textContent = t().breathMsg[mode];
  document.getElementById('b-skip').textContent = t().breathSkip;
  document.getElementById('b-close').style.display='none';
  document.getElementById('b-close').textContent = t().breathClose;
  document.getElementById('b-stretch').style.display='none';
  runBreathPhase();
}

function runBreathPhase(){
  const tx=t();
  const pattern = BREATH_PATTERNS[breathMode];
  const step = pattern[breathPhase];
  const col = BREATH_COLORS[step.ph];
  const phaseLabel = tx.breathPhases[step.ph];

  document.getElementById('b-lbl').textContent = phaseLabel;
  document.getElementById('b-num').textContent = step.dur;
  document.getElementById('b-cycle-lbl').textContent = `${tx.breathCycle} ${breathCycle+1} ${tx.breathCycleOf} ${TOTAL_CYCLES}`;
  document.getElementById('b-circle').style.background = col.bg;
  document.getElementById('b-circle').style.borderColor = col.border;
  document.getElementById('b-circle').style.color = col.text;

  // Ring animation
  const scale = step.ph==='inhale' ? 1.18 : step.ph==='hold' ? 1.18 : 1;
  document.getElementById('b-ring-out').style.transform = `scale(${scale})`;
  document.getElementById('b-ring-in').style.transform  = `scale(${scale*.9})`;

  playBreathSound(step.ph, step.dur);
  breathCount = step.dur;
  clearInterval(breathInterval);
  breathInterval = setInterval(()=>{
    breathCount--;
    document.getElementById('b-num').textContent = breathCount;
    if(breathCount <= 0){
      clearInterval(breathInterval);
      breathPhase++;
      if(breathPhase >= pattern.length){
        breathPhase=0; breathCycle++;
        if(breathCycle >= TOTAL_CYCLES){ endBreath(); return; }
      }
      runBreathPhase();
    }
  }, 1000);
}

function endBreath(){
  clearInterval(breathInterval);
  stopBreathSound();
  const tx=t();
  document.getElementById('b-num').textContent='✓';
  document.getElementById('b-lbl').textContent = tx.breathPhases.done;
  document.getElementById('b-circle').style.background='rgba(52,211,153,.2)';
  document.getElementById('b-circle').style.borderColor='#34d399';
  document.getElementById('b-circle').style.color='#34d399';
  document.getElementById('b-ring-out').style.transform='scale(1)';
  document.getElementById('b-ring-in').style.transform='scale(1)';
  document.getElementById('b-close').style.display='';
  document.getElementById('b-skip').style.display='none';
  // Stretch suggestion
  document.getElementById('b-stretch').style.display='';
  document.getElementById('b-stretch').innerHTML=`<div class="stretch-box"><p style="font-size:13px;color:rgba(255,255,255,.5);">${tx.breathStretch}</p></div>`;
}

function closeBreath(){
  clearInterval(breathInterval);
  stopBreathSound();
  document.getElementById('overlay-breath').classList.add('hidden');
}

        <select class="sel-input" id="sc-wksound" onchange="schedChange()">${wakeOpts}</select>
      </div>
      <button class="action-btn" style="background:rgba(167,139,250,.15);color:#a78bfa;border:1px solid rgba(167,139,250,.3);" onclick="saveSchedule()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        ${tx.saveSched}
      </button>
    </div>
  `;
  updateCyclesInfo();
}

function schedChange(){
  const sl=document.getElementById('sc-sleep');
  const wk=document.getElementById('sc-wake');
  const ss=document.getElementById('sc-slsound');
  const ws=document.getElementById('sc-wksound');
  if(sl) sched.sleepTime=sl.value;
  if(wk) sched.wakeTime=wk.value;
  if(ss) sched.sleepSound=ss.value;
  if(ws) sched.wakeSound=ws.value;
  updateCyclesInfo();
}

function toggleSched(key){
  sched[key]=!sched[key];
  const el=document.getElementById('tog-'+key);
  if(el){ el.className='tog'+(sched[key]?' on':''); }
}

function updateCyclesInfo(){
  const info=document.getElementById('cycles-info');
  if(!info) return;
  const [sh,sm]=sched.sleepTime.split(':').map(Number);
  const [wh,wm]=sched.wakeTime.split(':').map(Number);
  let mins=(wh*60+wm)-(sh*60+sm);
  if(mins<0) mins+=1440;
  const cycles=(mins/90).toFixed(1);
  const tx=t();
  info.textContent=`${(mins/60).toFixed(1)}h · ${cycles} ${tx.cycles}`;
}

function saveSchedule(){
  localStorage.setItem('fd_sched',JSON.stringify(sched));
  syncSchedule();
  showNotif('✓','','');
}

/* ════════════════════════════════════════════
   SCHEDULE CHECKING (sleep/wake alerts)
   ════════════════════════════════════════════ */
function checkSchedule(){
  setInterval(()=>{
    const now=new Date();
    const hm=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    if(hm===sched.sleepTime) showSleepOverlay();
    if(hm===sched.wakeTime)  showWakeOverlay();
  }, 30000);
}

function showSleepOverlay(){
  const tx=t();
  document.getElementById('sl-title').textContent=tx.sleepTitle;
  const phrase=tx.sleepPhrases[Math.floor(Math.random()*tx.sleepPhrases.length)];
  document.getElementById('sl-phrase').textContent=phrase;
  document.getElementById('sl-breath-btn').textContent=tx.sleepBreath;
  document.getElementById('sl-back-btn').textContent=tx.sleepBack;
  document.getElementById('overlay-sleep').classList.remove('hidden');
}
function closeSleep(){ document.getElementById('overlay-sleep').classList.add('hidden'); }

function showWakeOverlay(){
  const tx=t();
  document.getElementById('wk-title').textContent=tx.wakeTitle;
  const phrase=tx.wakePhrases[Math.floor(Math.random()*tx.wakePhrases.length)];
  document.getElementById('wk-phrase').textContent=phrase;
  document.getElementById('wk-breath-btn').textContent=tx.wakeBreath;
  document.getElementById('wk-close-btn').textContent=tx.wakeClose;
  document.getElementById('overlay-wake').classList.remove('hidden');
}
function closeWake(){ document.getElementById('overlay-wake').classList.add('hidden'); }

function showAlertOverlay(){
  const tx=t();
  document.getElementById('al-title').textContent=tx.alertTitle;
  document.getElementById('al-breath-btn').textContent=tx.alertBreath;
  document.getElementById('al-skip-btn').textContent=tx.alertSkip;
  document.getElementById('overlay-alert').classList.remove('hidden');
}

/* ════════════════════════════════════════════
   SUMMARY
   ════════════════════════════════════════════ */
function renderSummary(){
  const tx=t();
  const cats=['work','home','personal','study'];
  let html=`<p class="sec-title">${tx.sumTitle}</p>`;
  cats.forEach(c=>{
    const ct=tasks.filter(tk=>tk.cat===c);
    if(!ct.length) return;
    const done=ct.filter(tk=>tk.done).length;
    const pct=Math.round(done/ct.length*100);
    html+=`<div class="sum-card">
      <div class="sum-head">
        <span class="sum-cat-name">${tx.cats[c]}</span>
        <span class="sum-count">${done}/${ct.length}</span>
      </div>
      <div class="sum-bar"><div class="sum-fill" style="width:${pct}%;background:${tx.catColors[c]}"></div></div>
      ${ct.map(tk=>`<div class="sum-task ${tk.done?'done':''}">
        ${tk.done?'✓':'○'} ${escHtml(tk.text)}
      </div>`).join('')}
    </div>`;
  });
  document.getElementById('summary-content').innerHTML = html || '<p style="color:rgba(255,255,255,.2);font-size:13px;text-align:center;padding:20px 0;">—</p>';
}

/* ════════════════════════════════════════════
   BOTTOM NAV
   ════════════════════════════════════════════ */
const NAV_ICONS = {
  tasks:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12l2 2 4-4" stroke-linecap="round"/></svg>`,
  sound:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 10a6 6 0 10-11.8 1.5A4 4 0 105 19h13a4 4 0 000-8h-.2" stroke-linecap="round"/><line x1="8" y1="21" x2="7" y2="23" stroke-linecap="round"/><line x1="12" y1="21" x2="11" y2="23" stroke-linecap="round"/><line x1="16" y1="21" x2="15" y2="23" stroke-linecap="round"/></svg>`,
  breath:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9" stroke-dasharray="3 2"/><circle cx="12" cy="12" r="4"/></svg>`,
  clock:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round"/></svg>`,
  chart:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 17v-4M12 17v-7M16 17v-2" stroke-linecap="round"/></svg>`,
};
const NAV_TABS = ['tasks','sounds','breathe','schedule','summary'];

function renderNav(){
  const tx=t();
  const nav=document.getElementById('bottom-nav');
  nav.innerHTML=NAV_TABS.map((tab,i)=>`
    <button class="nav-btn ${activeTab===tab?'on':''}" onclick="switchTab('${tab}')">
      ${NAV_ICONS[tx.navIcons[i]]}
      ${tx.navTabs[i]}
    </button>
  `).join('');
}

function switchTab(tab){
  activeTab=tab;
  NAV_TABS.forEach(t=>{
    document.getElementById('tab-'+t).style.display = t===tab?'':'none';
  });
  if(tab==='summary') renderSummary();
  if(tab==='schedule') renderSchedule();
  renderNav();
}

/* ════════════════════════════════════════════
   NOTIFICATIONS
   ════════════════════════════════════════════ */
let notifTimeout;
function showNotif(title, sub, action){
  const el=document.getElementById('notif');
  document.getElementById('notif-title').textContent=title;
  document.getElementById('notif-sub').textContent=sub;
  document.getElementById('notif-action').textContent=action;
  el.classList.add('show');
  clearTimeout(notifTimeout);
  notifTimeout=setTimeout(()=>el.classList.remove('show'), 3200);
}

/* ════════════════════════════════════════════
   UTILITIES
   ════════════════════════════════════════════ */
function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════ */
(async function init(){
  renderAuthText();
  // Check existing session
  const {data:{session}} = await sb.auth.getSession();
  if(session){
    enterApp(session.user);
  }
  // Daily streak
  const today = new Date().toDateString();
  const lastDay = localStorage.getItem('fd_last_day');
  if(lastDay !== today){
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
    if(lastDay === yesterday.toDateString()) streak++;
    else if(!lastDay) streak=1;
    localStorage.setItem('fd_last_day', today);
    localStorage.setItem('fd_streak', streak);
  }
  // Reset daily tasks
  const lastReset = localStorage.getItem('fd_last_reset');
  if(lastReset !== today){
    tasks = tasks.map(tk=>tk.type==='daily'?{...tk,done:false}:tk);
    saveTasks();
    localStorage.setItem('fd_last_reset', today);
  }
})();
</script>
