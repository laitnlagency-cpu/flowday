<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1b4b">
<title>FlowDay</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0a0a0f;display:flex;justify-content:center;font-family:'DM Sans',sans-serif;}
#app{width:100%;max-width:430px;height:100vh;display:flex;flex-direction:column;color:#e8e4f0;position:relative;overflow:hidden;transition:background 3s;}
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;transition:opacity 2s;z-index:0;}
.star{position:absolute;border-radius:50%;background:white;animation:twinkle 3s infinite alternate;}
@keyframes twinkle{from{opacity:0.15}to{opacity:0.9}}
.scroll-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px;position:relative;z-index:2;}
.scroll-content::-webkit-scrollbar{display:none;}
.header{padding:52px 20px 14px;}
.app-title{font-family:'DM Serif Display',serif;font-size:32px;color:#f0eaff;letter-spacing:-0.5px;}
.app-sub{font-size:11px;color:rgba(255,255,255,0.25);margin-top:3px;}
.app-date{font-size:11px;color:rgba(255,255,255,0.18);margin-top:2px;letter-spacing:1px;}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;}
.lang-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);font-size:11px;padding:6px 12px;border-radius:20px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:52px;flex-shrink:0;}
.streak-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.trial-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.4);color:#a78bfa;font-size:10px;padding:4px 12px;border-radius:20px;}
.streak-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(251,146,60,0.12);border:1px solid rgba(251,146,60,0.3);color:#fb923c;font-size:10px;padding:4px 12px;border-radius:20px;}
.calm-bar{margin:0 16px 16px;padding:14px 16px;background:rgba(255,255,255,0.06);border-radius:16px;border-left:3px solid #a78bfa;}
.calm-bar p{color:#c4b5fd;font-size:13px;font-style:italic;line-height:1.6;}
.prog-section{padding:0 16px 16px;}
.prog-row{display:flex;justify-content:space-between;margin-bottom:6px;}
.prog-row span{font-size:10px;color:rgba(255,255,255,0.25);letter-spacing:1.5px;}
.prog-bar{height:3px;background:rgba(255,255,255,0.08);border-radius:2px;}
.prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#a78bfa,#f0abfc);transition:width 0.5s;}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;justify-content:space-around;padding:12px 8px 28px;background:rgba(8,5,18,0.92);backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.07);z-index:40;}
.bnav-btn{display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:none;color:rgba(255,255,255,0.25);font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif;padding:4px 16px;border-radius:12px;transition:all 0.2s;letter-spacing:0.5px;}
.bnav-btn.active{color:#a78bfa;}
.bnav-btn.active svg{filter:drop-shadow(0 0 6px rgba(167,139,250,0.6));}
.cats{display:flex;gap:6px;padding:0 16px 16px;}
.cat-btn{flex:1;padding:12px 4px 10px;border-radius:14px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.3);font-size:10px;text-align:center;cursor:pointer;transition:all 0.25s;font-family:'DM Sans',sans-serif;}
.cat-btn.active{border-color:var(--cc,#a78bfa);color:var(--cc,#a78bfa);background:rgba(167,139,250,0.1);}
.cat-icon{display:flex;justify-content:center;margin-bottom:5px;}
.section{padding:0 16px;}
.task-item{border-radius:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.07);margin-bottom:8px;overflow:hidden;}
.task-main{display:flex;align-items:center;gap:10px;padding:13px 14px;position:relative;}
.task-item.done .task-main{opacity:0.35;}
.check-btn{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(167,139,250,0.35);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.check-btn.checked{background:#a78bfa;border-color:#a78bfa;}
.task-info{flex:1;min-width:0;}
.task-text{font-size:14px;color:#ddd6fe;line-height:1.4;}
.task-item.done .task-text{text-decoration:line-through;color:#4a3f6b;}
.task-meta{display:flex;align-items:center;gap:6px;margin-top:4px;}
.task-type-badge{font-size:9px;padding:2px 7px;border-radius:8px;font-weight:500;letter-spacing:0.5px;}
.type-daily{background:rgba(52,211,153,0.12);color:#34d399;border:1px solid rgba(52,211,153,0.2);}
.type-once{background:rgba(167,139,250,0.12);color:#a78bfa;border:1px solid rgba(167,139,250,0.2);}
.timer-badge{font-size:10px;padding:4px 9px;border-radius:20px;background:rgba(167,139,250,0.12);color:#a78bfa;cursor:pointer;white-space:nowrap;border:1px solid rgba(167,139,250,0.2);font-family:'DM Sans',sans-serif;}
.timer-badge.running{color:#f0abfc;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.del-btn{background:transparent;border:none;color:rgba(255,255,255,0.12);cursor:pointer;font-size:18px;padding:4px;line-height:1;flex-shrink:0;}
.subtasks{padding:0 14px 12px 48px;}
.subtask-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,0.04);}
.sub-check{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.2);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.sub-check.checked{background:rgba(167,139,250,0.5);border-color:#a78bfa;}
.sub-text{flex:1;font-size:12px;color:rgba(255,255,255,0.5);}
.sub-text.done{text-decoration:line-through;color:rgba(255,255,255,0.2);}
.sub-del{background:transparent;border:none;color:rgba(255,255,255,0.1);cursor:pointer;font-size:14px;padding:2px;}
.add-subtask-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid rgba(255,255,255,0.04);}
.sub-input{flex:1;background:transparent;border:none;color:rgba(255,255,255,0.5);font-size:12px;outline:none;font-family:'DM Sans',sans-serif;}
.sub-input::placeholder{color:rgba(255,255,255,0.15);}
.sub-add-btn{background:rgba(167,139,250,0.2);border:none;color:#a78bfa;border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.expand-btn{background:transparent;border:none;color:rgba(255,255,255,0.2);cursor:pointer;font-size:11px;padding:0 4px;flex-shrink:0;transition:transform 0.2s;}
.expand-btn.open{transform:rotate(90deg);}
.add-task-card{background:rgba(255,255,255,0.04);border:1px dashed rgba(255,255,255,0.1);border-radius:14px;padding:14px;margin-bottom:8px;}
.add-task-row{display:flex;gap:8px;align-items:center;}
.add-input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#e8e4f0;font-size:13px;outline:none;font-family:'DM Sans',sans-serif;}
.add-input::placeholder{color:rgba(255,255,255,0.18);}
.add-btn{width:40px;height:40px;border-radius:10px;background:#a78bfa;border:none;color:#1a0a3b;font-size:20px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.type-select{display:flex;gap:6px;margin-top:8px;}
.type-opt{flex:1;padding:7px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:rgba(255,255,255,0.3);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;text-align:center;transition:all 0.2s;}
.type-opt.sel{border-color:#a78bfa;color:#a78bfa;background:rgba(167,139,250,0.12);}
.cat-limit{font-size:11px;color:rgba(255,255,255,0.2);text-align:center;padding:10px 0;}
.timer-picker{position:absolute;right:8px;top:52px;background:#12082a;border:1px solid rgba(167,139,250,0.3);border-radius:14px;padding:8px;z-index:30;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;min-width:200px;box-shadow:0 12px 40px rgba(0,0,0,0.6);}
.t-opt{padding:9px 6px;border-radius:9px;font-size:12px;background:rgba(255,255,255,0.04);color:#c4b5fd;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;text-align:center;}
.sum-card{background:rgba(255,255,255,0.05);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.07);}
.sum-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.sum-cat-label{font-size:13px;color:#c4b5fd;flex:1;}
.sum-count{font-size:11px;color:rgba(255,255,255,0.2);}
.sum-bar{height:2px;background:rgba(255,255,255,0.08);border-radius:2px;margin-bottom:8px;}
.sum-fill{height:100%;border-radius:2px;transition:width 0.4s;}
.sum-task{font-size:12px;color:rgba(255,255,255,0.35);padding:3px 0;display:flex;align-items:center;gap:6px;}
.sum-task.done{color:rgba(255,255,255,0.15);}
.sched-block{background:rgba(255,255,255,0.05);border-radius:16px;padding:18px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.07);}
.sched-title{font-size:10px;color:rgba(167,139,250,0.7);margin-bottom:16px;font-weight:500;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.sched-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sched-label{font-size:13px;color:rgba(255,255,255,0.45);}
.sched-label small{display:block;font-size:10px;color:rgba(255,255,255,0.18);margin-top:2px;}
.time-input{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:#f0eaff;padding:8px 12px;border-radius:10px;font-size:15px;font-family:'DM Sans',sans-serif;outline:none;}
.select-input{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:#f0eaff;padding:8px 12px;border-radius:10px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;}
.select-input option{background:#12082a;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.toggle-label{font-size:12px;color:rgba(255,255,255,0.35);}
.toggle{width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,0.1);border:none;cursor:pointer;position:relative;transition:background 0.3s;flex-shrink:0;}
.toggle.on{background:#a78bfa;}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:white;border-radius:50%;top:3px;left:3px;transition:left 0.3s;box-shadow:0 1px 4px rgba(0,0,0,0.3);}
.toggle.on::after{left:23px;}
.cycles-info{font-size:11px;color:#a78bfa;text-align:center;padding:10px 12px;background:rgba(167,139,250,0.08);border-radius:10px;line-height:1.5;margin:4px 0 8px;}
.divider{height:1px;background:rgba(255,255,255,0.05);margin:8px 0 12px;}
.sound-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px;}
.sound-btn{padding:14px 8px;border-radius:12px;border:1px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.35);font-size:12px;cursor:pointer;text-align:center;font-family:'DM Sans',sans-serif;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:7px;}
.sound-btn.active{border-color:#a78bfa;color:#a78bfa;background:rgba(167,139,250,0.12);}
.vol-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
.vol-row span{font-size:11px;color:rgba(255,255,255,0.25);}
.vol-row input{flex:1;accent-color:#a78bfa;}
.action-btn{width:100%;padding:14px;border-radius:12px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;}
.breath-card{background:rgba(255,255,255,0.05);border-radius:16px;padding:18px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.07);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:16px;}
.breath-card-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.breath-card-title{font-size:15px;color:#e8e4f0;font-weight:500;margin-bottom:3px;}
.breath-card-sub{font-size:12px;color:rgba(255,255,255,0.3);line-height:1.4;}
.breath-card-tag{font-size:10px;padding:3px 8px;border-radius:8px;font-weight:500;margin-top:6px;display:inline-block;}
.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;max-width:430px;margin:0 auto;}
.overlay.hidden{display:none;}
.breath-ring-wrap{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center;}
.breath-ring{position:absolute;border-radius:50%;transition:transform 1.2s ease-in-out,border-color 1.2s;}
.breath-circle{width:140px;height:140px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2;transition:all 1.2s;border:2px solid transparent;}
.breath-count{font-size:54px;font-family:'DM Serif Display',serif;line-height:1;}
.breath-label{font-size:11px;letter-spacing:3px;margin-top:6px;text-transform:uppercase;}
.overlay-btn{padding:12px 32px;border-radius:24px;background:transparent;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.4);cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;}
.stretch-box{background:rgba(255,255,255,0.07);border-radius:16px;padding:20px 24px;width:100%;max-width:300px;text-align:center;}
.paywall{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;max-width:430px;margin:0 auto;}
.paywall.hidden{display:none;}
.login-form{width:100%;display:flex;flex-direction:column;gap:10px;}
.login-input{padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.07);color:#e8e4f0;font-size:14px;outline:none;font-family:'DM Sans',sans-serif;}
.login-input::placeholder{color:rgba(255,255,255,0.18);}
.login-btn{padding:15px;border-radius:14px;background:#a78bfa;border:none;color:#1a0a3b;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;}
.login-switch{font-size:12px;color:rgba(255,255,255,0.2);text-align:center;cursor:pointer;}
.login-switch span{color:#a78bfa;}
.notif-banner{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-100%);width:100%;max-width:430px;z-index:60;padding:16px 20px;display:flex;align-items:center;gap:12px;transition:transform 0.4s cubic-bezier(.34,1.56,.64,1);background:rgba(12,6,28,0.96);backdrop-filter:blur(20px);border-bottom:1px solid rgba(167,139,250,0.2);}
.notif-banner.show{transform:translateX(-50%) translateY(0);}
.notif-text{flex:1;}
.notif-title{font-size:13px;color:#f0eaff;font-weight:500;}
.notif-sub{font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px;}
.notif-action{font-size:12px;color:#a78bfa;cursor:pointer;padding:6px 12px;border-radius:8px;background:rgba(167,139,250,0.12);}
</style>
</head>
<body>
<div id="app">
<div class="stars" id="stars"></div>
<svg style="display:none"><defs>

function save(){try{localStorage.setItem('fd_tasks',JSON.stringify(tasks));localStorage.setItem('fd_streak',streak);localStorage.setItem('fd_trial',trialDay);localStorage.setItem('fd_last',new Date().toDateString());localStorage.setItem('fd_lang',lang);}catch(e){}}
function load(){
  try{
    const l=localStorage.getItem('fd_lang');if(l)lang=l;
    const tk=localStorage.getItem('fd_tasks');if(tk)tasks=JSON.parse(tk);
    streak=parseInt(localStorage.getItem('fd_streak')||1);
    trialDay=parseInt(localStorage.getItem('fd_trial')||1);
    const last=localStorage.getItem('fd_last'),today=new Date().toDateString();
    if(last&&last!==today){
      const diff=(new Date(today)-new Date(last))/86400000;
      if(diff===1){streak++;trialDay++;}else if(diff>1)streak=1;
      tasks.forEach(t=>{if(t.type==='daily'){t.done=false;t.subtasks&&t.subtasks.forEach(s=>s.done=false);}});
      tasks=tasks.filter(t=>!(t.type==='once'&&t.done));
      save();
    }
  }catch(e){}
  if(!tasks.length)tasks=[
    {id:1,text:'',cat:'work',done:false,type:'daily',timer:null,remaining:null,running:false,subtasks:[]},
    {id:2,text:'',cat:'home',done:false,type:'daily',timer:null,remaining:null,running:false,subtasks:[]},
    {id:3,text:'',cat:'personal',done:false,type:'daily',timer:null,remaining:null,running:false,subtasks:[]},
    {id:4,text:'',cat:'study',done:false,type:'once',timer:null,remaining:null,running:false,subtasks:[]},
  ];
}

// ── AUDIO ─────────────────────────────────────────────────
function getAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function stopSound(){if(soundNode){try{soundNode.stop();}catch(e){}soundNode=null;}if(gainNode){gainNode.disconnect();gainNode=null;}}
function playSound(id){
  stopSound();if(!id)return;
  const ctx=getAC();gainNode=ctx.createGain();
  gainNode.gain.setValueAtTime(parseInt(document.getElementById('vol-sl').value||40)/100*0.3,ctx.currentTime);
  gainNode.connect(ctx.destination);
  const buf=ctx.createBuffer(2,ctx.sampleRate*4,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i++){
    if(id==='rain')d[i]=(Math.random()*2-1)*0.8*(1+0.2*Math.sin(i/1000));
    else if(id==='ocean')d[i]=(Math.random()*2-1)*0.5*Math.abs(Math.sin(i/8000))*1.5;
    else if(id==='fire')d[i]=(Math.random()*2-1)*0.6*(0.8+0.4*Math.sin(i/3000+Math.random()));
    else if(id==='wind')d[i]=(Math.random()*2-1)*0.4*(0.5+0.5*Math.sin(i/12000));
  }}
  soundNode=ctx.createBufferSource();soundNode.buffer=buf;soundNode.loop=true;soundNode.connect(gainNode);soundNode.start();
}
function toggleSound(id){activeSound=activeSound===id?null:id;if(activeSound)playSound(activeSound);else stopSound();renderSounds();}
function setVol(v){document.getElementById('vol-val').textContent=v+'%';if(gainNode)gainNode.gain.setValueAtTime(parseInt(v)/100*0.3,getAC().currentTime);}

function showNotif(icon,title,sub,action){
  pendingNotifAction=action||'normal';
  document.getElementById('notif-icon-wrap').innerHTML=svgI(icon,26,'#a78bfa');
  document.getElementById('notif-title').textContent=title;
  document.getElementById('notif-sub').textContent=sub;
  document.getElementById('notif-action-btn').textContent=t().notifStart;
  document.getElementById('notif-banner').classList.add('show');
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
  setTimeout(()=>document.getElementById('notif-banner').classList.remove('show'),8000);
}
function handleNotif(){document.getElementById('notif-banner').classList.remove('show');if(pendingNotifAction==='sleep')openSleepMode();else if(pendingNotifAction==='wake')openWakeMode();else startBreath(pendingNotifAction);}
function checkSchedule(){
  const now=new Date(),hm=now.getHours()*60+now.getMinutes(),sec=now.getSeconds();if(sec>1)return;
  const tm=s=>{const[h,m]=s.split(':').map(Number);return h*60+m;};
  const tx=t();
  if(schedToggles.sleep){const sm=tm(document.getElementById('sleep-t').value);if(hm===sm-60)showNotif('ico-moon',tx.notifSleepTitle,tx.notifSleepSub,'sleep');if(hm===sm)openSleepMode();}
  if(schedToggles.wake&&hm===tm(document.getElementById('wake-t').value))openWakeMode();
  if(schedToggles.focus&&hm===tm(document.getElementById('focus-t').value))showNotif('ico-breath',tx.notifFocusTitle,tx.notifFocusSub,'focus');
  if(schedToggles.relax&&hm===tm(document.getElementById('relax-t').value))showNotif('ico-breath',tx.notifRelaxTitle,tx.notifRelaxSub,'normal');
  if(schedToggles.pause){const f=parseInt(document.getElementById('pause-freq').value||2)*60;if(hm>0&&hm%f===0)showNotif('ico-breath',tx.notifPauseTitle,tx.notifPauseSub,'normal');}
}
function saveSchedule(){document.getElementById('next-alarm-lbl').textContent=t().nextAlarm+' '+document.getElementById('sleep-t').value;calcCycles();}
function toggleSched(key){schedToggles[key]=!schedToggles[key];document.getElementById('tog-'+key).classList.toggle('on',schedToggles[key]);}
function calcCycles(){
  const s=document.getElementById('sleep-t').value,w=document.getElementById('wake-t').value;if(!s||!w)return;
  const[sh,sm]=s.split(':').map(Number),[wh,wm]=w.split(':').map(Number);
  let m=(wh*60+wm)-(sh*60+sm);if(m<0)m+=1440;
  const info=t().cyclesInfo.replace('{h}',(m/60).toFixed(1)).replace('{c}',Math.floor(m/90));
  document.getElementById('cycles-info').textContent=info;
}

// ── TASKS ─────────────────────────────────────────────────
function renderTasks(){
  const tx=t();
  const filtered=tasks.filter(tk=>tk.cat===activeCat);
  let html='';
  filtered.forEach(tk=>{
    const tl=tk.running?fmt(tk.remaining):tk.timer?tk.timer+'min':'+ '+( lang==='es'?'Tiempo':'Time');
    const expanded=expandedTasks[tk.id];
    const subCount=tk.subtasks?tk.subtasks.length:0;
    const subDone=tk.subtasks?tk.subtasks.filter(s=>s.done).length:0;
    html+=`<div class="task-item${tk.done?' done':''}" id="task-${tk.id}">
      <div class="task-main" style="position:relative;">
        <button class="check-btn${tk.done?' checked':''}" onclick="toggleTask(${tk.id})">${tk.done?svgI('ico-check',14,'#1a0a3b'):''}</button>
        <div class="task-info">
          <div class="task-text">${tk.text}</div>
          <div class="task-meta">
            <span class="task-type-badge ${tk.type==='daily'?'type-daily':'type-once'}">${tk.type==='daily'?tx.daily:tx.once}</span>
            ${subCount>0?`<span style="font-size:10px;color:rgba(255,255,255,0.25);">${subDone}/${subCount} ${lang==='es'?'subtareas':'subtasks'}</span>`:''}
          </div>
        </div>
        <button class="timer-badge${tk.running?' running':''}" onclick="openPicker(event,${tk.id})">${tl}</button>
        <button class="expand-btn${expanded?' open':''}" onclick="toggleExpand(${tk.id})">›</button>
        <button class="del-btn" onclick="delTask(${tk.id})">×</button>
        <div id="picker-${tk.id}"></div>
      </div>`;
    if(expanded){
      html+=`<div class="subtasks">`;
      if(tk.subtasks)tk.subtasks.forEach(s=>{
        html+=`<div class="subtask-item"><button class="sub-check${s.done?' checked':''}" onclick="toggleSub(${tk.id},${s.id})">${s.done?svgI('ico-check',10,'white'):''}</button><span class="sub-text${s.done?' done':''}">${s.text}</span><button class="sub-del" onclick="delSub(${tk.id},${s.id})">×</button></div>`;
      });
      if(!tk.subtasks||tk.subtasks.length<5){
        html+=`<div class="add-subtask-row"><input class="sub-input" id="sub-inp-${tk.id}" placeholder="${tx.addSub}" onkeydown="if(event.key==='Enter')addSub(${tk.id})"><button class="sub-add-btn" onclick="addSub(${tk.id})">+</button></div>`;
      }else{html+=`<div style="font-size:10px;color:rgba(255,255,255,0.2);padding:4px 0;">${tx.maxSubs}</div>`;}
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  if(filtered.length<5){
    html+=`<div class="add-task-card"><div class="add-task-row"><input class="add-input" id="new-task" placeholder="${tx.addTask}" onkeydown="if(event.key==='Enter')addTask()"><button class="add-btn" onclick="addTask()">+</button></div><div class="type-select"><button class="type-opt${newTaskType==='daily'?' sel':''}" onclick="setNewType('daily')">${tx.daily}</button><button class="type-opt${newTaskType==='once'?' sel':''}" onclick="setNewType('once')">${tx.once}</button></div></div>`;
  }else{html+=`<div class="cat-limit">${tx.maxTasks}</div>`;}
  document.getElementById('task-list').innerHTML=html;
  renderProgress();
}
function setNewType(tp){newTaskType=tp;renderTasks();}
function toggleExpand(id){expandedTasks[id]=!expandedTasks[id];renderTasks();}
function fmt(s){const m=Math.floor(s/60),sc=s%60;return m+':'+(sc<10?'0':'')+sc;}
function openPicker(e,id){
  e.stopPropagation();document.querySelectorAll('.timer-picker').forEach(p=>p.remove());
  if(tasks.find(tk=>tk.id===id).running){stopTimer(id);return;}
  const div=document.createElement('div');div.className='timer-picker';
  div.innerHTML=TIMES.map(t=>`<button class="t-opt" onclick="setTimer(${id},${t})">${t}m</button>`).join('');
  document.getElementById('picker-'+id).appendChild(div);
  setTimeout(()=>document.addEventListener('click',()=>document.querySelectorAll('.timer-picker').forEach(p=>p.remove()),{once:true}),100);
}
function setTimer(id,mins){document.querySelectorAll('.timer-picker').forEach(p=>p.remove());const tk=tasks.find(t=>t.id===id);tk.timer=mins;tk.remaining=mins*60;tk.running=true;clearInterval(taskIntervals[id]);taskIntervals[id]=setInterval(()=>tickTimer(id),1000);renderAll();save();}
function tickTimer(id){const tk=tasks.find(t=>t.id===id);if(!tk||!tk.running)return;tk.remaining--;if(tk.remaining<=0){tk.running=false;clearInterval(taskIntervals[id]);if(navigator.vibrate)navigator.vibrate([400,200,400,200,400]);document.getElementById('alert-title').textContent=tk.text;document.getElementById('alert-overlay').classList.remove('hidden');}renderAll();save();}
function stopTimer(id){const tk=tasks.find(t=>t.id===id);tk.running=false;tk.remaining=null;tk.timer=null;clearInterval(taskIntervals[id]);renderAll();save();}
function toggleTask(id){const tk=tasks.find(t=>t.id===id);tk.done=!tk.done;if(tk.done&&tk.running)stopTimer(id);renderAll();save();}
function delTask(id){clearInterval(taskIntervals[id]);tasks=tasks.filter(t=>t.id!==id);delete expandedTasks[id];renderAll();save();}
function addTask(){const inp=document.getElementById('new-task');if(!inp||!inp.value.trim())return;if(tasks.filter(t=>t.cat===activeCat).length>=5)return;tasks.push({id:Date.now(),text:inp.value.trim(),cat:activeCat,done:false,type:newTaskType,timer:null,remaining:null,running:false,subtasks:[]});inp.value='';renderAll();save();}
function toggleSub(tid,sid){const tk=tasks.find(t=>t.id===tid);const s=tk.subtasks.find(s=>s.id===sid);s.done=!s.done;renderAll();save();}
function delSub(tid,sid){const tk=tasks.find(t=>t.id===tid);tk.subtasks=tk.subtasks.filter(s=>s.id!==sid);renderAll();save();}
function addSub(tid){const inp=document.getElementById('sub-inp-'+tid);if(!inp||!inp.value.trim())return;const tk=tasks.find(t=>t.id===tid);if(!tk.subtasks)tk.subtasks=[];if(tk.subtasks.length>=5)return;tk.subtasks.push({id:Date.now(),text:inp.value.trim(),done:false});if(!expandedTasks[tid])expandedTasks[tid]=true;inp.value='';renderAll();save();}
function renderProgress(){const dn=tasks.filter(t=>t.done).length,tot=tasks.length;document.getElementById('prog-count').textContent=dn+'/'+tot;document.getElementById('prog-fill').style.width=tot?Math.round(dn/tot*100)+'%':'0%';}

// ── SUMMARY ───────────────────────────────────────────────
function renderSummary(){
  document.getElementById('sum-content').innerHTML=CATS_IDS.map((id,i)=>{
    const ct=tasks.filter(tk=>tk.cat===id),dn=ct.filter(tk=>tk.done).length;
    const pct=ct.length?Math.round(dn/ct.length*100):0;
    return `<div class="sum-card"><div class="sum-head">${svgI(CAT_ICONS[i],16,CAT_COLORS[i])}<span class="sum-cat-label">${t().cats[i]}</span><span class="sum-count">${dn}/${ct.length}</span></div><div class="sum-bar"><div class="sum-fill" style="width:${pct}%;background:${CAT_COLORS[i]}"></div></div>${ct.map(tk=>`<div class="sum-task${tk.done?' done':''}"><span style="opacity:0.4">${tk.done?'✓':'·'}</span>${tk.text}<span style="font-size:10px;opacity:0.3;margin-left:4px;">${tk.type==='daily'?'↺':''}</span></div>`).join('')}</div>`;
  }).join('')+'<div style="height:20px;"></div>';
}

// ── BREATH CARDS ──────────────────────────────────────────
function renderBreathCards(){
  const tx=t();
  document.getElementById('breath-cards').innerHTML=BT_IDS.map((id,i)=>
    `<div class="breath-card" style="border-color:${BT_BORDERS[i]};" onclick="startBreath('${id}')">
      <div class="breath-card-icon" style="background:${BT_BGS[i]};">${svgI('ico-breath',26,BT_COLORS[i])}</div>
      <div style="flex:1;"><div class="breath-card-title">${tx.breathTypes[i].title}</div><div class="breath-card-sub">${tx.breathTypes[i].sub}</div><span class="breath-card-tag" style="background:${BT_BGS[i]};color:${BT_COLORS[i]};">${tx.breathTypes[i].tag}</span></div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
    </div>`
  ).join('')+'<div style="height:20px;"></div>';
}

// ── SOUNDS ────────────────────────────────────────────────
function renderSounds(){
  document.getElementById('sound-grid').innerHTML=SOUND_IDS.map((id,i)=>
    `<button class="sound-btn${activeSound===id?' active':''}" onclick="toggleSound('${id}')">${svgI(SOUND_ICONS[i],24,activeSound===id?'#a78bfa':'rgba(255,255,255,0.28)')}<span>${t().sounds[i]}</span></button>`
  ).join('');
}

// ── SLEEP / WAKE ──────────────────────────────────────────
function openSleepMode(){const tx=t();document.getElementById('sleep-phrase').textContent=tx.sleepPhrases[Math.floor(Math.random()*tx.sleepPhrases.length)];document.getElementById('app').style.background='linear-gradient(160deg,#150005,#3b0000,#7f1d1d)';document.getElementById('sleep-overlay').classList.remove('hidden');if(activeSound)playSound(activeSound);}
function closeSleep(){document.getElementById('sleep-overlay').classList.add('hidden');stopSound();applyBg();}
function openWakeMode(){const tx=t();document.getElementById('wake-phrase').textContent=tx.wakePhrases[Math.floor(Math.random()*tx.wakePhrases.length)];document.getElementById('wake-overlay').classList.remove('hidden');}
function closeWake(){document.getElementById('wake-overlay').classList.add('hidden');}

// ── BREATH ────────────────────────────────────────────────
function startBreath(mode){
  ['alert-overlay','sleep-overlay','wake-overlay'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  bModeIdx=BT_IDS.indexOf(mode);if(bModeIdx<0)bModeIdx=0;
  bPhase=0;bCycles=0;bCount=BT_PHASES[bModeIdx][0].dur;
  clearInterval(bInterval);updateBreath();
  const ov=document.getElementById('breath-overlay');ov.classList.remove('hidden');
  ov.style.background=mode==='sleep'?'rgba(12,3,3,0.99)':mode==='wake'?'rgba(20,10,0,0.99)':mode==='focus'?'rgba(5,10,28,0.99)':'rgba(8,5,22,0.99)';
  document.getElementById('bclose').style.display='none';document.getElementById('stretch-wrap').style.display='none';document.getElementById('bmsg').style.display='block';
  bInterval=setInterval(tickBreath,1000);
}
function tickBreath(){
  const ph=BT_PHASES[bModeIdx];bCount--;
  if(bCount<=0){bPhase=(bPhase+1)%ph.length;if(bPhase===0)bCycles++;bCount=ph[bPhase].dur;
    const max=bModeIdx===2?5:3;
    if(bCycles>=max){clearInterval(bInterval);if(bModeIdx===3)showStretches();else{document.getElementById('bcount').textContent='✓';document.getElementById('blabel').textContent=t().continueBtn.replace(' ✓','');document.getElementById('bclose').style.display='block';}return;}
  }
  updateBreath();
  const max=bModeIdx===2?5:3;
  document.getElementById('bcycle').textContent=t().cycleLbl+' '+(bCycles+1)+' '+t().cycleOf+' '+max;
}
function updateBreath(){
  const ph=BT_PHASES[bModeIdx][bPhase];
  const labels=t().breathLabels[bModeIdx];
  document.getElementById('bcount').textContent=bCount;document.getElementById('bcount').style.color=ph.c;
  document.getElementById('blabel').textContent=labels[bPhase];document.getElementById('blabel').style.color=ph.c;
  const outer=document.getElementById('bring-outer'),inner=document.getElementById('bring-inner');
  outer.style.borderColor=ph.c+'22';inner.style.borderColor=ph.c+'44';
  if(bPhase===0){outer.style.transform='scale(1.18)';inner.style.transform='scale(1.12)';document.getElementById('bcircle').style.transform='scale(1.06)';}
  else if(bPhase===1){outer.style.transform='scale(1.18)';inner.style.transform='scale(1.12)';}
  else{outer.style.transform='scale(1)';inner.style.transform='scale(1)';document.getElementById('bcircle').style.transform='scale(1)';}
  document.getElementById('bcircle').style.borderColor=ph.c+'33';
  const calm=t().calm;document.getElementById('bmsg').textContent='"'+calm[0][bCycles%calm[0].length]+'"';
}
function showStretches(){stretchIdx=0;document.getElementById('stretch-wrap').style.display='block';document.getElementById('bmsg').style.display='none';showStretch();}
function showStretch(){
  const tx=t();const s=tx.stretches[stretchIdx];
  document.getElementById('stretch-wrap').innerHTML=`<div class="stretch-box"><div style="font-size:40px;margin-bottom:10px;">${['🙆','🔄','🦵','🫁'][stretchIdx]}</div><div style="font-size:16px;color:#fed7aa;margin-bottom:6px;font-weight:500;">${s.name}</div><div style="font-size:13px;color:rgba(255,255,255,0.35);line-height:1.7;">${s.desc}</div>${stretchIdx<3?`<button onclick="nextStretch()" style="margin-top:14px;padding:10px 24px;border-radius:22px;background:rgba(251,146,60,0.15);border:1px solid rgba(251,146,60,0.35);color:#fb923c;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;">${tx.stretchNext}</button>`:`<button onclick="closeBreath()" style="margin-top:14px;padding:10px 24px;border-radius:22px;background:rgba(255,255,255,0.9);border:none;color:#1a0a3b;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;">${tx.stretchDone}</button>`}</div>`;
}
function nextStretch(){stretchIdx++;showStretch();}
function closeBreath(){document.getElementById('breath-overlay').classList.add('hidden');document.getElementById('bmsg').style.display='block';renderAll();}
function renderAll(){renderCats();renderTasks();if(view==='summary')renderSummary();}

makeStars();applyBg();applyTranslations();
</script>
</body>
</html>
